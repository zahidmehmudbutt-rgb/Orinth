  <body>
    <div id="root">
      <div id="loading-fallback" style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:system-ui;flex-direction:column;gap:1rem">
        <div style="width:40px;height:40px;border:4px solid #e5e7eb;border-top:4px solid #0066FF;border-radius:50%;animation:spin 1s linear infinite"></div>
        <p style="color:#666">Loading School Smart Pakistan...</p>

      </div>
    </div>
    <noscript>
      <div style="padding:2rem;text-align:center;font-family:system-ui">
        <h1>JavaScript Required</h1>
        <p>Please enable JavaScript to use School Smart Pakistan.</p>
      </div>
    </noscript>
    <script>
      // Debug: Track if JS modules load
      window.__APP_DEBUG = { htmlLoaded: true, jsStarted: false, reactMounted: false };
      window.addEventListener('error', function(e) {
        document.getElementById('loading-fallback').innerHTML =
          '<div style="padding:2rem;color:red;text-align:center"><h2>Load Error</h2><pre style="text-align:left;background:#f3f4f6;padding:1rem;border-radius:8px;overflow:auto;max-width:600px;margin:1rem auto">' +
          e.message + '\n' + (e.filename || '') + ':' + (e.lineno || '') + '</pre></div>';
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
